<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="site-container">
    <header class="site-header">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="site-tagline">{{ site.description }}</p>
    </header>
    <main class="site-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. Designed for quiet reflection.</p>
    </footer>
  </div>
</body>
</html>
